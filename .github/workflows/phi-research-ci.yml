name: Phi Research - Fork Only
# This workflow must remain confined to MichaelWave369/bitcoin's research branch.
# It never submits upstream PRs, contacts Bitcoin nodes, or handles real funds.
on:
  push:
    branches:
      - phi-research
    paths:
      - "contrib/phi-research/**"
      - ".github/workflows/phi-research-ci.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    if: github.repository == 'MichaelWave369/bitcoin'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m compileall -q contrib/phi-research
      - name: Offline test suite (never calls GitHub)
        run: python3 -m unittest discover -s contrib/phi-research -p 'test_*.py' -v

  public-api-smoke:
    if: github.repository == 'MichaelWave369/bitcoin'
    needs: offline-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Network/rate-limit failures are visible in this job but do not mask
    # the independently deterministic offline test result.
    continue-on-error: true
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read two public Bitcoin Core issues (unauthenticated GET only)
        shell: bash
        run: |
          set -euo pipefail
          python3 contrib/phi-research/triage.py --issue 36874 --issue 36913 > "$RUNNER_TEMP/phi-issues.json"
          python3 - "$RUNNER_TEMP/phi-issues.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["source"] == "bitcoin/bitcoin"
          assert report["read_only"] is True
          assert [issue["number"] for issue in report["issues"]] == [36874, 36913]
          print("Verified public, read-only issue metadata:", [i["number"] for i in report["issues"]])
          PY
